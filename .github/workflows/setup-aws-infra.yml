name: Setup AWS Infrastructure

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: 'AWS Region'
        required: true
        default: 'ap-southeast-2'
      yt_dlp_verbose:
        description: 'Enable yt-dlp verbose logging (true/false)'
        required: false
        default: 'false'
      daily_quota:
        description: 'Default API calls per day per user'
        required: false
        default: '200'
      rate_limit:
        description: 'Max requests per second per user'
        required: false
        default: '5'

env:
  APP_NAME: media-extractor
  DYNAMODB_TABLE: media-extractor-records
  LAMBDA_TIMEOUT: 60
  LAMBDA_MEMORY: 512

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.aws_region }}

      - name: Resolve account ID
        id: account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "ecr_registry=$ACCOUNT_ID.dkr.ecr.${{ github.event.inputs.aws_region }}.amazonaws.com" >> $GITHUB_OUTPUT

      # ── 1. ECR ────────────────────────────────────────────────────────────
      - name: Create ECR repository
        run: |
          aws ecr describe-repositories --repository-names $APP_NAME \
            --region ${{ github.event.inputs.aws_region }} 2>/dev/null \
          || aws ecr create-repository \
              --repository-name $APP_NAME \
              --region ${{ github.event.inputs.aws_region }}
          echo "ECR_REPOSITORY=$APP_NAME" >> $GITHUB_ENV

      # ── 2. Build & push initial image ─────────────────────────────────────
      - name: Build and push image to ECR
        id: build
        env:
          ECR_REGISTRY: ${{ steps.account.outputs.ecr_registry }}
        run: |
          aws ecr get-login-password --region ${{ github.event.inputs.aws_region }} \
            | docker login --username AWS --password-stdin $ECR_REGISTRY
          docker build -t $APP_NAME .
          IMAGE_URI="$ECR_REGISTRY/$APP_NAME:latest"
          docker tag $APP_NAME:latest $IMAGE_URI
          docker push $IMAGE_URI
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      # ── 3. DynamoDB ───────────────────────────────────────────────────────
      - name: Create DynamoDB table
        run: |
          aws dynamodb describe-table --table-name $DYNAMODB_TABLE \
            --region ${{ github.event.inputs.aws_region }} 2>/dev/null \
          || aws dynamodb create-table \
              --table-name $DYNAMODB_TABLE \
              --attribute-definitions AttributeName=id,AttributeType=S \
              --key-schema AttributeName=id,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region ${{ github.event.inputs.aws_region }}

      # ── 4. IAM Role ───────────────────────────────────────────────────────
      - name: Create IAM role
        id: iam
        run: |
          ROLE_NAME="${APP_NAME}-lambda-role"

          ROLE_ARN=$(aws iam get-role --role-name $ROLE_NAME \
            --query 'Role.Arn' --output text 2>/dev/null) || \
          ROLE_ARN=$(aws iam create-role \
            --role-name $ROLE_NAME \
            --assume-role-policy-document '{
              "Version":"2012-10-17",
              "Statement":[{
                "Effect":"Allow",
                "Principal":{"Service":"lambda.amazonaws.com"},
                "Action":"sts:AssumeRole"
              }]
            }' \
            --query 'Role.Arn' --output text)

          aws iam attach-role-policy \
            --role-name $ROLE_NAME \
            --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

          aws iam put-role-policy \
            --role-name $ROLE_NAME \
            --policy-name "${APP_NAME}-dynamodb" \
            --policy-document "{
              \"Version\":\"2012-10-17\",
              \"Statement\":[{
                \"Effect\":\"Allow\",
                \"Action\":[\"dynamodb:PutItem\",\"dynamodb:GetItem\",\"dynamodb:Scan\"],
                \"Resource\":\"arn:aws:dynamodb:${{ github.event.inputs.aws_region }}:${{ steps.account.outputs.id }}:table/$DYNAMODB_TABLE\"
              }]
            }"

          echo "role_arn=$ROLE_ARN" >> $GITHUB_OUTPUT
          echo "Waiting 10s for IAM role to propagate..."
          sleep 10

      # ── 5. Lambda ─────────────────────────────────────────────────────────
      - name: Create Lambda function
        id: lambda
        run: |
          FUNCTION_ARN=$(aws lambda get-function \
            --function-name $APP_NAME \
            --region ${{ github.event.inputs.aws_region }} \
            --query 'Configuration.FunctionArn' --output text 2>/dev/null) || true

          if [ -z "$FUNCTION_ARN" ]; then
            FUNCTION_ARN=$(aws lambda create-function \
              --function-name $APP_NAME \
              --package-type Image \
              --code ImageUri=${{ steps.build.outputs.image_uri }} \
              --role ${{ steps.iam.outputs.role_arn }} \
              --timeout $LAMBDA_TIMEOUT \
              --memory-size $LAMBDA_MEMORY \
              --environment "Variables={DYNAMODB_TABLE=$DYNAMODB_TABLE,YT_DLP_VERBOSE=${{ github.event.inputs.yt_dlp_verbose }}}" \
              --region ${{ github.event.inputs.aws_region }} \
              --query 'FunctionArn' --output text)

            aws lambda wait function-active \
              --function-name $APP_NAME \
              --region ${{ github.event.inputs.aws_region }}
          fi

          echo "function_arn=$FUNCTION_ARN" >> $GITHUB_OUTPUT

      # ── 6. REST API + Usage Plan ──────────────────────────────────────────
      - name: Create REST API
        id: apigw
        run: |
          REGION="${{ github.event.inputs.aws_region }}"
          ACCOUNT_ID="${{ steps.account.outputs.id }}"
          LAMBDA_ARN="${{ steps.lambda.outputs.function_arn }}"

          # Check if API exists and is fully configured
          API_ID=$(aws apigateway get-rest-apis \
            --region $REGION \
            --query "items[?name=='$APP_NAME'].id" --output text)

          if [ -n "$API_ID" ]; then
            METHOD_EXISTS=$(aws apigateway get-method \
              --rest-api-id $API_ID \
              --resource-id $(aws apigateway get-resources \
                --rest-api-id $API_ID --region $REGION \
                --query "items[?path=='/get-media'].id" --output text) \
              --http-method POST \
              --region $REGION \
              --query 'httpMethod' --output text 2>/dev/null) || true

            if [ -n "$METHOD_EXISTS" ]; then
              echo "REST API already fully configured, skipping."
            else
              echo "REST API exists but incomplete — deleting and recreating..."
              aws apigateway delete-rest-api --rest-api-id $API_ID --region $REGION
              API_ID=""
            fi
          fi

          if [ -z "$API_ID" ]; then
            # Create REST API
            API_ID=$(aws apigateway create-rest-api \
              --name $APP_NAME \
              --region $REGION \
              --query 'id' --output text)

            # Get root resource
            ROOT_ID=$(aws apigateway get-resources \
              --rest-api-id $API_ID --region $REGION \
              --query 'items[0].id' --output text)

            # Create /get-media resource
            RESOURCE_ID=$(aws apigateway create-resource \
              --rest-api-id $API_ID \
              --parent-id $ROOT_ID \
              --path-part get-media \
              --region $REGION \
              --query 'id' --output text)

            # Create POST method with API key required
            aws apigateway put-method \
              --rest-api-id $API_ID \
              --resource-id $RESOURCE_ID \
              --http-method POST \
              --authorization-type NONE \
              --api-key-required \
              --region $REGION

            # Lambda proxy integration
            aws apigateway put-integration \
              --rest-api-id $API_ID \
              --resource-id $RESOURCE_ID \
              --http-method POST \
              --type AWS_PROXY \
              --integration-http-method POST \
              --uri "arn:aws:apigateway:$REGION:lambda:path/2015-03-31/functions/$LAMBDA_ARN/invocations" \
              --region $REGION

            # Deploy to prod stage
            aws apigateway create-deployment \
              --rest-api-id $API_ID \
              --stage-name prod \
              --region $REGION

            # Lambda invoke permission
            aws lambda add-permission \
              --function-name $APP_NAME \
              --statement-id "apigateway-rest-invoke" \
              --action lambda:InvokeFunction \
              --principal apigateway.amazonaws.com \
              --source-arn "arn:aws:execute-api:$REGION:$ACCOUNT_ID:$API_ID/*/POST/get-media" \
              --region $REGION

            # Create Usage Plan
            PLAN_ID=$(aws apigateway create-usage-plan \
              --name "${APP_NAME}-plan" \
              --api-stages "apiId=$API_ID,stage=prod" \
              --throttle "burstLimit=10,rateLimit=${{ github.event.inputs.rate_limit }}" \
              --quota "limit=${{ github.event.inputs.daily_quota }},period=DAY" \
              --region $REGION \
              --query 'id' --output text)

            echo "plan_id=$PLAN_ID" >> $GITHUB_OUTPUT
          else
            PLAN_ID=$(aws apigateway get-usage-plans \
              --region $REGION \
              --query "items[?name=='${APP_NAME}-plan'].id" --output text)
            echo "plan_id=$PLAN_ID" >> $GITHUB_OUTPUT
          fi

          API_ENDPOINT="https://$API_ID.execute-api.$REGION.amazonaws.com/prod/get-media"
          echo "api_id=$API_ID" >> $GITHUB_OUTPUT
          echo "endpoint=$API_ENDPOINT" >> $GITHUB_OUTPUT

      # ── 7. Create initial API key ─────────────────────────────────────────
      - name: Create initial API key
        id: apikey
        run: |
          REGION="${{ github.event.inputs.aws_region }}"
          PLAN_ID="${{ steps.apigw.outputs.plan_id }}"

          KEY_ID=$(aws apigateway create-api-key \
            --name "${APP_NAME}-owner" \
            --enabled \
            --region $REGION \
            --query 'id' --output text)

          KEY_VALUE=$(aws apigateway get-api-key \
            --api-key $KEY_ID \
            --include-value \
            --region $REGION \
            --query 'value' --output text)

          aws apigateway create-usage-plan-key \
            --usage-plan-id $PLAN_ID \
            --key-id $KEY_ID \
            --key-type API_KEY \
            --region $REGION

          echo "key_value=$KEY_VALUE" >> $GITHUB_OUTPUT

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Print summary
        run: |
          echo "## Setup Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**API Endpoint**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "POST ${{ steps.apigw.outputs.endpoint }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Your API Key (owner)**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.apikey.outputs.key_value }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Quota: ${{ github.event.inputs.daily_quota }} calls/day, ${{ github.event.inputs.rate_limit }} req/s**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Add these GitHub Secrets for CI/CD deploys:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "ECR_REPOSITORY       = $APP_NAME" >> $GITHUB_STEP_SUMMARY
          echo "LAMBDA_FUNCTION_NAME = $APP_NAME" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "curl -X POST ${{ steps.apigw.outputs.endpoint }} \\" >> $GITHUB_STEP_SUMMARY
          echo "  -H 'x-api-key: ${{ steps.apikey.outputs.key_value }}' \\" >> $GITHUB_STEP_SUMMARY
          echo "  -H 'Content-Type: application/json' \\" >> $GITHUB_STEP_SUMMARY
          echo "  -d '{\"url\": \"https://x.com/NASA/status/1\"}'" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
