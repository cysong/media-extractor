name: Setup AWS Infrastructure

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: 'AWS Region'
        required: true
        default: 'ap-southeast-2'

env:
  APP_NAME: media-extractor
  DYNAMODB_TABLE: media-extractor-records
  LAMBDA_TIMEOUT: 60
  LAMBDA_MEMORY: 512

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.aws_region }}

      - name: Resolve account ID
        id: account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "ecr_registry=$ACCOUNT_ID.dkr.ecr.${{ github.event.inputs.aws_region }}.amazonaws.com" >> $GITHUB_OUTPUT

      # ── 1. ECR ────────────────────────────────────────────────────────────
      - name: Create ECR repository
        run: |
          aws ecr describe-repositories --repository-names $APP_NAME \
            --region ${{ github.event.inputs.aws_region }} 2>/dev/null \
          || aws ecr create-repository \
              --repository-name $APP_NAME \
              --region ${{ github.event.inputs.aws_region }}
          echo "ECR_REPOSITORY=$APP_NAME" >> $GITHUB_ENV

      # ── 2. Build & push initial image ─────────────────────────────────────
      - name: Build and push image to ECR
        id: build
        env:
          ECR_REGISTRY: ${{ steps.account.outputs.ecr_registry }}
        run: |
          aws ecr get-login-password --region ${{ github.event.inputs.aws_region }} \
            | docker login --username AWS --password-stdin $ECR_REGISTRY
          docker build -t $APP_NAME .
          IMAGE_URI="$ECR_REGISTRY/$APP_NAME:latest"
          docker tag $APP_NAME:latest $IMAGE_URI
          docker push $IMAGE_URI
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      # ── 3. DynamoDB ───────────────────────────────────────────────────────
      - name: Create DynamoDB table
        run: |
          aws dynamodb describe-table --table-name $DYNAMODB_TABLE \
            --region ${{ github.event.inputs.aws_region }} 2>/dev/null \
          || aws dynamodb create-table \
              --table-name $DYNAMODB_TABLE \
              --attribute-definitions AttributeName=id,AttributeType=S \
              --key-schema AttributeName=id,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region ${{ github.event.inputs.aws_region }}

      # ── 4. IAM Role ───────────────────────────────────────────────────────
      - name: Create IAM role
        id: iam
        run: |
          ROLE_NAME="${APP_NAME}-lambda-role"

          ROLE_ARN=$(aws iam get-role --role-name $ROLE_NAME \
            --query 'Role.Arn' --output text 2>/dev/null) || \
          ROLE_ARN=$(aws iam create-role \
            --role-name $ROLE_NAME \
            --assume-role-policy-document '{
              "Version":"2012-10-17",
              "Statement":[{
                "Effect":"Allow",
                "Principal":{"Service":"lambda.amazonaws.com"},
                "Action":"sts:AssumeRole"
              }]
            }' \
            --query 'Role.Arn' --output text)

          aws iam attach-role-policy \
            --role-name $ROLE_NAME \
            --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

          aws iam put-role-policy \
            --role-name $ROLE_NAME \
            --policy-name "${APP_NAME}-dynamodb" \
            --policy-document "{
              \"Version\":\"2012-10-17\",
              \"Statement\":[{
                \"Effect\":\"Allow\",
                \"Action\":[\"dynamodb:PutItem\",\"dynamodb:GetItem\",\"dynamodb:Scan\"],
                \"Resource\":\"arn:aws:dynamodb:${{ github.event.inputs.aws_region }}:${{ steps.account.outputs.id }}:table/$DYNAMODB_TABLE\"
              }]
            }"

          echo "role_arn=$ROLE_ARN" >> $GITHUB_OUTPUT
          echo "Waiting 10s for IAM role to propagate..."
          sleep 10

      # ── 5. Lambda ─────────────────────────────────────────────────────────
      - name: Create Lambda function
        id: lambda
        run: |
          FUNCTION_ARN=$(aws lambda get-function \
            --function-name $APP_NAME \
            --region ${{ github.event.inputs.aws_region }} \
            --query 'Configuration.FunctionArn' --output text 2>/dev/null) || true

          if [ -z "$FUNCTION_ARN" ]; then
            FUNCTION_ARN=$(aws lambda create-function \
              --function-name $APP_NAME \
              --package-type Image \
              --code ImageUri=${{ steps.build.outputs.image_uri }} \
              --role ${{ steps.iam.outputs.role_arn }} \
              --timeout $LAMBDA_TIMEOUT \
              --memory-size $LAMBDA_MEMORY \
              --environment "Variables={DYNAMODB_TABLE=$DYNAMODB_TABLE}" \
              --region ${{ github.event.inputs.aws_region }} \
              --query 'FunctionArn' --output text)

            aws lambda wait function-active \
              --function-name $APP_NAME \
              --region ${{ github.event.inputs.aws_region }}
          fi

          echo "function_arn=$FUNCTION_ARN" >> $GITHUB_OUTPUT

      # ── 6. API Gateway ────────────────────────────────────────────────────
      - name: Create API Gateway
        id: apigw
        run: |
          REGION="${{ github.event.inputs.aws_region }}"

          API_ID=$(aws apigatewayv2 get-apis \
            --region $REGION \
            --query "Items[?Name=='$APP_NAME'].ApiId" --output text)

          if [ -n "$API_ID" ]; then
            # Check if route is fully configured; if not, delete and recreate
            ROUTE_EXISTS=$(aws apigatewayv2 get-routes \
              --api-id $API_ID --region $REGION \
              --query "Items[?RouteKey=='POST /get-media'].RouteId" --output text)

            if [ -z "$ROUTE_EXISTS" ]; then
              echo "API exists but route is missing — deleting and recreating..."
              aws apigatewayv2 delete-api --api-id $API_ID --region $REGION
              API_ID=""
            else
              echo "API Gateway already fully configured, skipping."
            fi
          fi

          if [ -z "$API_ID" ]; then
            API_ID=$(aws apigatewayv2 create-api \
              --name $APP_NAME \
              --protocol-type HTTP \
              --region $REGION \
              --query 'ApiId' --output text)

            INTEGRATION_ID=$(aws apigatewayv2 create-integration \
              --api-id $API_ID \
              --integration-type AWS_PROXY \
              --integration-uri ${{ steps.lambda.outputs.function_arn }} \
              --payload-format-version "2.0" \
              --region $REGION \
              --query 'IntegrationId' --output text)

            aws apigatewayv2 create-route \
              --api-id $API_ID \
              --route-key "POST /get-media" \
              --target "integrations/$INTEGRATION_ID" \
              --region $REGION

            aws apigatewayv2 create-stage \
              --api-id $API_ID \
              --stage-name '$default' \
              --auto-deploy \
              --region $REGION

            aws lambda add-permission \
              --function-name $APP_NAME \
              --statement-id "apigateway-invoke" \
              --action lambda:InvokeFunction \
              --principal apigateway.amazonaws.com \
              --source-arn "arn:aws:execute-api:$REGION:${{ steps.account.outputs.id }}:$API_ID/*/*/get-media" \
              --region $REGION 2>/dev/null || true
          fi

          API_ENDPOINT="https://$API_ID.execute-api.$REGION.amazonaws.com/get-media"
          echo "endpoint=$API_ENDPOINT" >> $GITHUB_OUTPUT

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Print summary
        run: |
          echo "## Setup Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**API Endpoint**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "POST ${{ steps.apigw.outputs.endpoint }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Add these remaining GitHub Secrets for CI/CD deploys:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "ECR_REPOSITORY     = $APP_NAME" >> $GITHUB_STEP_SUMMARY
          echo "LAMBDA_FUNCTION_NAME = $APP_NAME" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "curl -X POST ${{ steps.apigw.outputs.endpoint }} \\" >> $GITHUB_STEP_SUMMARY
          echo "  -H 'Content-Type: application/json' \\" >> $GITHUB_STEP_SUMMARY
          echo "  -d '{\"url\": \"https://x.com/NASA/status/1\"}'" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
